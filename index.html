<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#7c3aed" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Zivvo" />
    <meta name="application-name" content="Zivvo" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/icon-512.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="mask-icon" href="/favicon.png" color="#7c3aed" />

    <title>Zivvo — Autos kaufen &amp; verkaufen in Deutschland</title>
    <meta name="description" content="Zivvo ist ein deutscher Fahrzeugmarktplatz mit strukturierten Inseraten, transparenten Preisen und serverseitig geprüften Zahlungsabläufen.">
    <meta name="author" content="Zivvo" />
    <meta name="keywords" content="Gebrauchtwagen, Auto kaufen, Auto verkaufen, Fahrzeugmarkt Deutschland, Autohändler, Zivvo, Autofinanzierung, mobile.de Alternative, AutoScout24 Alternative" />
    <link rel="canonical" href="https://zivvo.de" />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />

    <!-- Geo targeting -->
    <meta name="geo.region" content="DE" />
    <meta name="geo.placename" content="Deutschland" />

    <!-- Open Graph -->
    <meta property="og:site_name" content="Zivvo" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://zivvo.de" />
    <meta property="og:image" content="https://zivvo.de/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="de_DE" />
    <meta property="og:locale:alternate" content="en_US" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@Zivvo" />
    <meta name="twitter:creator" content="@Zivvo" />
    <meta name="twitter:image" content="https://zivvo.de/og-image.png" />

    <!-- Structured Data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "Organization",
          "@id": "https://zivvo.de/#organization",
          "name": "Zivvo",
          "url": "https://zivvo.de",
          "logo": {
            "@type": "ImageObject",
            "url": "https://zivvo.de/icon-512.png",
            "width": 512,
            "height": 512
          },
          "address": {
            "@type": "PostalAddress",
            "addressCountry": "DE"
          }
        },
        {
          "@type": "WebSite",
          "@id": "https://zivvo.de/#website",
          "name": "Zivvo",
          "url": "https://zivvo.de",
          "inLanguage": "de-DE",
          "publisher": { "@id": "https://zivvo.de/#organization" },
          "potentialAction": {
            "@type": "SearchAction",
            "target": {
              "@type": "EntryPoint",
              "urlTemplate": "https://zivvo.de/browse?q={search_term_string}"
            },
            "query-input": "required name=search_term_string"
          }
        },
        {
          "@type": "WebApplication",
          "name": "Zivvo",
          "description": "Fahrzeugmarktplatz für Deutschland — Autos kaufen, verkaufen, finanzieren.",
          "applicationCategory": "AutomotiveMarketplace",
          "operatingSystem": "Web",
          "offers": {
            "@type": "Offer",
            "price": "0",
            "priceCurrency": "EUR"
          }
        }
      ]
    }
    </script>
    <meta property="og:title" content="Zivvo — Autos kaufen &amp; verkaufen in Deutschland" />
    <meta name="twitter:title" content="Zivvo — Autos kaufen &amp; verkaufen in Deutschland" />
    <meta property="og:description" content="Deutscher Fahrzeugmarktplatz mit strukturierten Inseraten, transparenten Preisen und serverseitig geprüften Zahlungsabläufen." />
    <meta name="twitter:description" content="Deutscher Fahrzeugmarktplatz mit strukturierten Inseraten, transparenten Preisen und serverseitig geprüften Zahlungsabläufen." />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
