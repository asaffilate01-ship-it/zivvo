<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#e8622c" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <link rel="icon" type="image/png" href="/icon-192.png">

    <title>AutoSouq — Buy &amp; Sell Cars with Confidence</title>
    <meta name="description" content="Browse thousands of verified vehicles from trusted dealers and private sellers. Finance checks, full history reports, and transparent pricing across UK, UAE, USA &amp; Pakistan.">
    <meta name="author" content="AutoSouq" />
    <meta name="keywords" content="used cars, buy car, sell car, car marketplace, used car UK, car dealer, AutoSouq, car finance check, HPI check, car auction" />
    <link rel="canonical" href="https://autosouq.app" />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />

    <!-- Geo targeting -->
    <meta name="geo.region" content="GB" />
    <meta name="geo.placename" content="United Kingdom" />

    <!-- Open Graph -->
    <meta property="og:site_name" content="AutoSouq" />
    
    
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://autosouq.app" />
    <meta property="og:image" content="https://autosouq.app/og-image.png">
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="en_GB" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@AutoSouq" />
    <meta name="twitter:creator" content="@AutoSouq" />
    <meta name="twitter:image" content="https://autosouq.app/og-image.png">

    <!-- Structured Data: Organization + WebSite + SearchAction -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "Organization",
          "@id": "https://autosouq.app/#organization",
          "name": "AutoSouq",
          "url": "https://autosouq.app",
          "logo": {
            "@type": "ImageObject",
            "url": "https://autosouq.app/icon-512.png",
            "width": 512,
            "height": 512
          },
          "sameAs": [
            "https://twitter.com/AutoSouq",
            "https://www.facebook.com/AutoSouq",
            "https://www.instagram.com/AutoSouq",
            "https://www.linkedin.com/company/autosouq"
          ],
          "contactPoint": {
            "@type": "ContactPoint",
            "contactType": "customer service",
            "url": "https://autosouq.app/contact"
          }
        },
        {
          "@type": "WebSite",
          "@id": "https://autosouq.app/#website",
          "name": "AutoSouq",
          "url": "https://autosouq.app",
          "publisher": { "@id": "https://autosouq.app/#organization" },
          "potentialAction": {
            "@type": "SearchAction",
            "target": {
              "@type": "EntryPoint",
              "urlTemplate": "https://autosouq.app/browse?q={search_term_string}"
            },
            "query-input": "required name=search_term_string"
          }
        },
        {
          "@type": "WebApplication",
          "name": "AutoSouq",
          "description": "Buy & sell cars with verified dealers and private sellers. Finance checks, history reports, and transparent pricing.",
          "applicationCategory": "AutomotiveMarketplace",
          "operatingSystem": "Web",
          "offers": {
            "@type": "Offer",
            "price": "0",
            "priceCurrency": "GBP"
          }
        }
      ]
    }
    </script>
    <meta property="og:title" content="AutoSouq — Buy &amp; Sell Cars with Confidence">
  <meta name="twitter:title" content="AutoSouq — Buy &amp; Sell Cars with Confidence">
  <meta property="og:description" content="Browse thousands of verified vehicles from trusted dealers and private sellers. Finance checks, full history reports, and transparent pricing across UK, UAE, USA &amp; Pakistan.">
  <meta name="twitter:description" content="Browse thousands of verified vehicles from trusted dealers and private sellers. Finance checks, full history reports, and transparent pricing across UK, UAE, USA &amp; Pakistan.">
</head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
